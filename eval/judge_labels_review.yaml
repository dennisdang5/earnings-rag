  question: What does Capital One's annual report this year say about credit risk?
  answer: 'The filing asked for, Capital One''s FY2026 10-K, is not available. The information provided is from Capital One''s
    FY2025 10-K.


    1. **Risk Management Oversight**: The Enterprise Risk Officer, in consultation with the Chief Credit and Financial Risk
    Officer, oversees the identification and assessment of risks associated with the company''s strategy, including credit
    risk. This involves ongoing assessments and periodic reviews to monitor these risks throughout the year [COF_2025-12-31_0146].


    2. **Loan Portfolio and Credit Exposure**: The majority of Capital One''s credit risk exposure comes from its loan portfolio,
    which includes various lending products such as credit cards, auto loans, and commercial loans. The company emphasizes
    that its credit policies govern these lending activities and are subject to independent review and approval [COF_2025-12-31_0146].


    3. **Consumer and Counterparty Credit Risk**: Capital One faces consumer credit risk due to its significant proportion
    of consumer loans, which may lead to higher delinquencies and charge-offs compared to peers. Additionally, the company
    is exposed to counterparty credit risk from various business activities, including derivative transactions and investment
    securities [COF_2025-12-31_0047].


    4. **Credit Quality Indicators**: The company closely monitors economic conditions and loan performance trends, using
    delinquency rates and borrower credit scores as key indicators of credit quality. For commercial loans, internal risk
    ratings are used to assess credit risk [COF_2025-12-31_0149].


    5. **Allowance for Credit Losses**: Capital One measures its allowance for credit losses under the current expected credit
    losses (CECL) standard, which is based on management''s estimates of expected lifetime credit losses. This measurement
    is influenced by economic conditions and the characteristics of financial instruments [COF_2025-12-31_0047].


    These points illustrate Capital One''s comprehensive approach to managing credit risk, including monitoring, assessment,
    and the use of various metrics to gauge credit quality.'
