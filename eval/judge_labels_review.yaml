- label_id: L11
  question: What does Apple's latest 10-Q say about tariffs?
  answer: 'In Apple''s latest 10-Q for Q3 FY2026, the company discusses tariffs and their potential impacts on its business.
    Here are the key points:


    1. **New Tariffs**: Beginning in the second quarter of 2025, new tariffs were announced on imports to the U.S., including
    additional tariffs on imports from several countries such as China, India, Japan, South Korea, Taiwan, Vietnam, and the
    European Union. In response, some countries have imposed or threatened reciprocal tariffs on U.S. imports.


    2. **Investigation Results**: On January 14, 2026, the U.S. Department of Commerce published initial results of an investigation
    into semiconductor imports. This announcement did not impose additional tariffs affecting Apple''s products.


    3. **Supreme Court Ruling**: On February 20, 2026, the U.S. Supreme Court struck down certain tariffs previously imposed
    under the International Emergency Economic Powers Act. Apple has applied for refunds on tariffs paid and recognized any
    refunds received as a reduction in the cost of sales for products.


    4. **Future Uncertainty**: The company notes that various modifications to U.S. tariffs have been announced, and further
    changes could occur, including additional tariffs related to the semiconductor sector investigation. The impact of these
    tariffs on Apple''s business, including supply chain, pricing, and gross margin, remains uncertain and could be materially
    adverse [AAPL_2026-06-27_0008][AAPL_2026-06-27_0009].'
  claim: The impact of these tariffs on Apple's business, including supply chain, pricing, and gross margin, remains uncertain
    and could be materially adverse [AAPL_2026-06-27_0008][AAPL_2026-06-27_0009].
