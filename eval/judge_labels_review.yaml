- label_id: L29
  question: What did NVIDIA report last quarter about data center demand?
  answer: 'In NVIDIA''s Q2 FY2027 report, the company highlighted several key points regarding data center demand:


    1. **Revenue Growth**: Data Center revenue reached $89.0 billion, which is an increase of 117% year-over-year [calc_1]
    and 18% sequentially [calc_2]. This growth was primarily driven by the ramp-up of their Blackwell Ultra infrastructure.
    Hyperscale revenue more than doubled from the previous year and increased by 13% sequentially, also benefiting from the
    strength of Blackwell Ultra [NVDA_2026-07-26_0025].


    2. **Supply and Capacity Commitments**: NVIDIA increased its supply and capacity commitments significantly, from $119
    billion last quarter to $279 billion as of July 26, 2026, to meet future demand [NVDA_2026-07-26_0021].


    3. **Challenges in Infrastructure Deployment**: The company acknowledged that the availability of essential resources
    such as land, power, and capital is crucial for building out data centers. They indicated that any shortages could impact
    future revenue and financial performance. Additionally, they mentioned that AI clouds and model makers face challenges
    in securing long-term infrastructure contracts and financing, which could delay deployments and affect the growth of NVIDIA''s
    revenue [NVDA_2026-07-26_0021].


    4. **New Business Model**: NVIDIA introduced a new business model with select AI cloud partners to enhance access to their
    data center infrastructure products. This model aims to help AI cloud partners meet strong customer demand and robust
    sales pipelines, which are currently constrained by the need for large-scale infrastructure [NVDA_2026-07-26_0022].


    Overall, while NVIDIA reported strong revenue growth in the data center segment, they also highlighted significant challenges
    and constraints that could affect future demand and deployment of their products.'
  claim: This model aims to help AI cloud partners meet strong customer demand and robust sales pipelines, which are currently
    constrained by the need for large-scale infrastructure [NVDA_2026-07-26_0022].
