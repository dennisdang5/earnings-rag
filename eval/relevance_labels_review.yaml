    1. **Risk Management Oversight**: The Enterprise Risk Officer, in consultation with the Chief Credit and Financial Risk
    Officer, oversees the identification and assessment of risks associated with the company''s strategy, including credit
    risk. This involves ongoing assessments and periodic reviews to monitor these risks throughout the year [COF_2025-12-31_0146].


    2. **Loan Portfolio and Credit Exposure**: The majority of Capital One''s credit risk exposure comes from its loan portfolio,
    which includes various lending products such as credit cards and personal loans. The company employs automated underwriting
    systems based on predictive models to assess creditworthiness, using factors like credit bureau information and applicant
    income [COF_2025-12-31_0146].


    3. **Business Mix and Delinquencies**: Capital One''s diverse business mix, which includes a significant proportion of
    consumer loans, may lead to higher delinquencies and charge-offs compared to other large banks. This could result in increased
    credit losses and regulatory scrutiny [COF_2025-12-31_0047].


    4. **Counterparty Credit Risk**: The company also faces counterparty credit risk from various activities, including derivative
    transactions and investment securities. Failures by counterparties to meet their obligations could lead to financial losses
    and increased credit losses [COF_2025-12-31_0047].


    5. **Credit Quality Indicators**: Capital One monitors delinquency rates and borrower credit scores as key indicators
    of credit quality. These metrics help in assessing potential future credit losses across different loan portfolios [COF_2025-12-31_0149].


    Overall, Capital One emphasizes a proactive approach to managing credit risk through continuous monitoring and assessment
    of its loan portfolios and market conditions.'
