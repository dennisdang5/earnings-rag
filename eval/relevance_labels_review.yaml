- id: nvda-export-controls-annual
  run: 1
  question: How do export controls affect NVIDIA's business?
  answer: 'Export controls significantly affect NVIDIA''s business in several ways:


    1. **Competitive Position**: NVIDIA''s competitive position has been harmed by existing export controls, and there is
    a risk that future changes could further damage it. The U.S. government''s (USG) export control rules can change at any
    time, potentially subjecting a wider range of NVIDIA products to restrictions and licensing requirements. This could negatively
    impact the company''s business and financial results, particularly in key markets like China and the Middle East, where
    they may be effectively excluded from selling certain products [NVDA_2025-01-26_0015].


    2. **Market Access**: The complexity of export controls has led to NVIDIA being unable to create and deliver competitive
    products for China''s data center market, as they must receive approval from both the USG and the Chinese government.
    This situation has allowed competitors to build larger ecosystems, which could have a material adverse impact on NVIDIA''s
    business and operating results [NVDA_2026-01-25_0014].


    3. **Investment Risks**: Export controls increase the risk associated with investing in U.S. advanced semiconductor products.
    New products may be subject to unilateral export controls by the time they are ready for market, leading to excess inventory
    and financial obligations. This situation can also drive investment towards foreign competitors who are less likely to
    face such restrictions [NVDA_2026-01-25_0054].


    4. **Compliance Burdens**: The increasingly complex export controls impose significant compliance obligations on NVIDIA''s
    partners, suppliers, and customers. Allegations of non-compliance, even if unsubstantiated, can harm NVIDIA''s business
    relationships and reputation [NVDA_2026-01-25_0054].


    5. **Tariffs and Costs**: Recent licensing requirements have introduced tariffs on products shipped to certain markets,
    such as China. This can lead to increased costs that NVIDIA may not be able to pass on to customers, further impacting
    their competitive position [NVDA_2026-01-25_0014].


    Overall, the evolving landscape of export controls poses substantial challenges for NVIDIA, affecting their market access,
    competitive dynamics, and operational costs.'
  label: ''
