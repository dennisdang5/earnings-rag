<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the filings</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F6F8; --sheet: #FFFFFF; --ink: #15212C; --muted: #566573;
    --rule: #D5DCE3; --blue: #1D4F91; --blue-soft: #E3ECF7;
    --highlight: #F2E35B; --error: #B03A2E; --ok: #2E7D4F; --warn: #A56A00;
    --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #121820; --sheet: #1A222C; --ink: #E6ECF1; --muted: #95A3B1;
      --rule: #2B3642; --blue: #8DB6EE; --blue-soft: #1F2F45;
      --highlight: rgba(242, 227, 91, 0.38); --error: #F08A7E; --ok: #6CC48C; --warn: #E0B050;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 24px 24px; }

  header { max-width: 640px; margin: 0 auto 24px; text-align: center; }
  h1 {
    font-size: clamp(2rem, 4vw, 2.75rem); line-height: 1.1; font-weight: 700;
    letter-spacing: -0.02em; margin: 0 0 12px;
  }
  .lede { color: var(--muted); margin: 0; font-size: 1.02rem; }

  .thread { max-width: 760px; margin: 0 auto; }
  .thread-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .link {
    border: 0; background: none; color: var(--blue); font: 500 0.85rem var(--sans);
    padding: 0; cursor: pointer;
  }

  .turn { margin: 0 0 40px; }
  .turn-q {
    width: fit-content; max-width: 90%; margin: 0 0 16px auto; padding: 10px 14px;
    background: var(--blue-soft); border-radius: 14px 14px 4px 14px;
    font-weight: 500; overflow-wrap: anywhere;
  }

  .steps { list-style: none; margin: 0 0 14px; padding: 0; font-size: 0.88rem; color: var(--muted); }
  .steps li { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--rule); transform: translateY(-1px); }
  .steps li.pending .dot { background: var(--blue); animation: pulse 1s ease-in-out infinite; }
  .steps li.done .dot { background: var(--ok); }
  .steps li.warn .dot { background: var(--warn); }
  .steps .res { margin-left: auto; padding-left: 12px; white-space: nowrap; }
  .steps li.warn .res { color: var(--warn); }
  @keyframes pulse { 50% { opacity: 0.25; } }

  .progress { min-height: 20px; margin: 0 0 8px; color: var(--muted); font-size: 0.9rem; }
  .progress.error { color: var(--error); }

  .answer { font-size: 1.08rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer.refused { color: var(--muted); }
  .note { margin-top: 14px; font-size: 0.92rem; color: var(--muted); }

  .cite {
    font: 600 0.72em var(--sans); color: var(--blue); background: var(--blue-soft);
    border: 0; border-radius: 4px; padding: 1px 5px; margin: 0 1px;
    vertical-align: 0.25em; cursor: pointer;
  }
  .cite:hover { background: var(--highlight); color: var(--ink); }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .toggle {
    border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
    border-radius: 999px; padding: 7px 16px; font: 500 0.88rem var(--sans); cursor: pointer;
  }
  .toggle:hover { border-color: var(--blue); color: var(--blue); }
  .sources { margin-top: 24px; }

  .flagline {
    margin: 14px 0 0; padding: 8px 12px; border-left: 3px solid var(--warn);
    background: var(--sheet); font-size: 0.9rem; color: var(--ink);
  }
  .flagline button { margin-left: 6px; }

  .panel { margin-top: 24px; padding: 18px 20px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; }
  .panel h3 {
    margin: 22px 0 8px; font: 700 0.72rem var(--sans); letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted);
  }
  .panel h3:first-child { margin-top: 0; }
  .check { display: flex; gap: 10px; align-items: baseline; padding: 3px 0; font-size: 0.92rem; }
  .check .dot { background: var(--ok); }
  .check.warn .dot { background: var(--warn); }
  .check.info .dot { background: var(--blue); }
  .check ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.85rem; }
  .panel details { border-top: 1px solid var(--rule); padding: 8px 0; }
  .panel details:first-of-type { border-top: 0; }
  .panel summary { cursor: pointer; font-size: 0.9rem; }
  .panel summary .res { color: var(--muted); margin-left: 8px; }
  .panel summary.warn .res { color: var(--warn); }
  .panel details > :not(summary) { margin-top: 8px; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 0.82rem; width: 100%; }
  th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.num, td.nw { white-space: nowrap; }
  td.num { text-align: right; }
  pre {
    margin: 0; padding: 10px 12px; background: var(--paper); border-radius: 8px; font: 0.78rem/1.5 ui-monospace, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto;
  }
  .plist { margin: 0; padding-left: 18px; font-size: 0.85rem; }
  .plist li { margin-bottom: 4px; }

  .passage { border-left: 3px solid var(--rule); padding: 2px 0 2px 16px; margin-bottom: 26px; }
  .passage.lit { border-left-color: var(--highlight); cursor: pointer; }
  .meta {
    display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
    font-size: 0.82rem; color: var(--muted); margin-bottom: 8px;
  }
  .ref, .tick { font-weight: 700; color: var(--ink); }
  .quote { font: 1rem/1.65 var(--serif); margin: 0; overflow-wrap: anywhere; }
  .value { font: 600 1.15rem var(--sans); margin: 0; }
  .detail { font-size: 0.85rem; color: var(--muted); margin: 2px 0 0; overflow-wrap: anywhere; }
  .hl {
    background-image: linear-gradient(transparent 58%, var(--highlight) 58%);
    background-repeat: no-repeat; background-size: 0% 100%;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    transition: background-size 0.9s ease-out;
  }
  .passage.swept .hl { background-size: 100% 100%; }
  .more {
    margin-top: 8px; border: 0; background: none; color: var(--blue);
    font: 500 0.85rem var(--sans); padding: 0; cursor: pointer;
  }

  .composer {
    position: sticky; bottom: 0; z-index: 5; padding: 28px 24px 14px;
    background: linear-gradient(to bottom, transparent, var(--paper) 22px);
  }
  .ask { max-width: 760px; margin: 0 auto; }
  .field {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px;
    padding: 10px 10px 10px 16px;
  }
  .field:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    color: var(--ink); font: inherit; font-size: 1.05rem;
    min-height: 28px; max-height: 200px; padding: 6px 0;
  }
  .btn {
    border: 0; border-radius: 8px; background: var(--ink); color: var(--sheet);
    font: 600 0.95rem var(--sans); padding: 10px 18px; cursor: pointer;
  }
  .btn.stop { background: var(--error); color: #fff; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  @media (max-width: 600px) {
    .field { flex-wrap: wrap; }
    textarea { flex-basis: 100%; }
    .composer { padding: 24px 12px 10px; }
  }

  .examples-label { margin: 18px 0 8px; text-align: center; font-size: 0.85rem; color: var(--muted); }
  .examples {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;
    margin-top: 0; font-size: 0.88rem;
  }
  .example {
    border: 1px solid var(--rule); background: transparent; color: var(--ink);
    border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer;
    text-align: left; line-height: 1.4;
  }
  .example:hover { border-color: var(--blue); color: var(--blue); }
  .example:last-child:nth-child(odd) { grid-column: 1 / -1; justify-self: center; }
  @media (max-width: 600px) {
    .examples { grid-template-columns: 1fr; }
  }

  .preview {
    position: absolute; z-index: 10; max-width: 340px;
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 8px 24px rgba(21, 33, 44, 0.14);
    font-size: 0.88rem; pointer-events: none;
    opacity: 0; transform: translateY(4px); transition: opacity 0.12s, transform 0.12s;
  }
  .preview.show { opacity: 1; transform: none; }
  .preview .quote { font-size: 0.92rem; }


  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ask the filings</h1>
    <p class="lede">Ask about NVIDIA, Apple, or Capital One. The agent searches their 10-K and 10-Q filings and looks up reported figures, and every claim cites what it came from.</p>
  </header>

  <section class="thread" id="thread" aria-label="Conversation">
    <div class="thread-bar" id="thread-bar" hidden>
      <button type="button" class="link" id="clear">New chat</button>
    </div>
  </section>
</div>

<div class="composer">
  <form class="ask" id="form">
    <div class="field">
      <textarea id="q" rows="1" aria-label="Your question"></textarea>
      <button class="btn" id="go" type="submit">Ask</button>
    </div>
    <div id="examples-wrap">
      <p class="examples-label">Or try one of these</p>
      <div class="examples" id="examples"></div>
    </div>
  </form>
</div>

<div class="preview" id="preview" role="tooltip"></div>

<script>
const REFUSAL = "The provided filings do not address this.";
const PLACEHOLDER = "Ask about results, risks, or a quarter…";
const EXAMPLES = [
  "What was NVIDIA's revenue growth in fiscal 2025?",
  "What did NVIDIA say about export controls in its latest quarterly report?",
  "Compare Apple and NVIDIA gross margin in fiscal 2025.",
  "What is NVIDIA's diluted EPS for fiscal 2025?",
  "What are the main credit risks Capital One describes?",
];
// What the citation check calls its findings, in words for the timeline.
const PROBLEMS = {
  uncited: "a figure had no citation",
  unknown_ids: "a cited id was not found",
  unsupported: "a cited figure did not match its source",
  unacknowledged_missing: "a missing filing was not mentioned",
  slice_mismatch: "a company total was cited as a product figure",
};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (id) => document.getElementById(id);
const form = $("form"), q = $("q"), go = $("go"), thread = $("thread"), preview = $("preview");

let busy = false;
let controller = null;
let turns = [];

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---- examples, composer -------------------------------------------------------

q.placeholder = PLACEHOLDER;
$("examples").replaceChildren(...EXAMPLES.map((ex) => {
  const b = el("button", "example", ex);
  b.type = "button";
  b.onclick = () => { q.value = ex; autosize(); form.requestSubmit(); };
  return b;
}));

function autosize() {
  q.style.height = "auto";
  q.style.height = q.scrollHeight + "px";
}
q.addEventListener("input", autosize);
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!busy) form.requestSubmit(); }
});

function setBusy(on) {
  busy = on;
  go.textContent = on ? "Stop" : "Ask";
  go.classList.toggle("stop", on);
}

function updateThreadChrome() {
  $("thread-bar").hidden = turns.length === 0;
  $("examples-wrap").hidden = turns.length > 0;
}

$("clear").addEventListener("click", () => {
  if (controller) controller.abort();
  turns.forEach((t) => t.el.remove());
  turns = [];
  hidePreview();
  updateThreadChrome();
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (busy) { controller.abort(); return; }
  const question = q.value.trim();
  if (!question) return;

  q.value = "";
  autosize();
  const t = createTurn(question);
  turns.push(t);
  updateThreadChrome();
  t.el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });

  controller = new AbortController();
  setBusy(true);
  try {
    await runAgent(t, question, controller.signal);
  } catch (err) {
    const stopped = err.name === "AbortError";
    t.progress.className = stopped ? "progress" : "progress error";
    t.progress.textContent = stopped ? "Stopped." : err.message;
  } finally {
    setBusy(false);
    controller = null;
  }
});

// ---- one question and its answer ---------------------------------------------

function createTurn(question) {
  const t = {
    text: "", items: [], cards: [], sweepTimer: null, pending: [], revisions: [],
    el: el("article", "turn"), progress: el("p", "progress"), answer: el("div", "answer"),
    note: el("p", "note"), steps: el("ol", "steps"), passages: el("div"), sources: el("div", "sources"),
    panelToggle: el("button", "toggle"), sourcesToggle: el("button", "toggle"), toggles: el("div", "toggles"),
    panel: el("div", "panel"), flags: el("p", "flagline"),
  };
  t.note.hidden = true;
  t.sources.hidden = true;
  t.sources.append(t.passages);
  t.panel.hidden = true;
  t.flags.hidden = true;
  t.panelToggle.type = t.sourcesToggle.type = "button";
  t.panelToggle.hidden = t.sourcesToggle.hidden = true;
  t.panelToggle.addEventListener("click", () => setPanelOpen(t, t.panel.hidden));
  t.sourcesToggle.addEventListener("click", () => setSourcesOpen(t, t.sources.hidden));
  t.toggles.append(t.panelToggle, t.sourcesToggle);
  t.el.append(el("p", "turn-q", question), t.steps, t.progress, t.answer, t.flags, t.note, t.toggles, t.panel, t.sources);
  thread.append(t.el);

  t.answer.addEventListener("click", (e) => {
    const b = e.target.closest(".cite");
    if (b) highlight(t, Number(b.dataset.n));
  });
  t.answer.addEventListener("mouseover", (e) => {
    const b = e.target.closest(".cite");
    if (b) showPreview(t, b);
  });
  t.answer.addEventListener("mouseout", (e) => { if (e.target.closest(".cite")) hidePreview(); });
  t.answer.addEventListener("focusin", (e) => {
    const b = e.target.closest(".cite");
    if (b) showPreview(t, b);
  });
  t.answer.addEventListener("focusout", hidePreview);
  t.passages.addEventListener("click", (e) => {
    if (e.target.closest(".more")) return; // expanding shouldn't clear it
    if (e.target.closest(".passage.lit")) clearHighlight(t);
  });
  return t;
}

function setSourcesOpen(t, open) {
  t.sources.hidden = !open;
  t.sourcesToggle.setAttribute("aria-expanded", String(open));
  t.sourcesToggle.textContent = open
    ? "Hide sources"
    : `Show ${t.items.length} source${t.items.length === 1 ? "" : "s"}`;
}

function setPanelOpen(t, open) {
  t.panel.hidden = !open;
  t.panelToggle.setAttribute("aria-expanded", String(open));
  t.panelToggle.textContent = open ? "Hide how this was computed" : "How this was computed";
}

function finishTurn(t) {
  t.progress.textContent = "";
  if (t.text.includes(REFUSAL)) {
    t.answer.classList.add("refused");
    t.note.textContent = "Nothing in these filings covers that question. Try asking about NVIDIA, Apple, or Capital One.";
    t.note.hidden = false;
  }
  if (t.items.length) {
    t.sourcesToggle.hidden = false;
    setSourcesOpen(t, false);
  }
}

// ---- server-sent events --------------------------------------------------------

async function stream(url, body, signal, onEvent) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal,
  });
  if (!res.ok || !res.body) {
    throw new Error(`Couldn't get an answer (error ${res.status}). Try again in a moment.`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let end;
    while ((end = buffer.indexOf("\n\n")) !== -1) {
      const raw = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      onEvent(parseEvent(raw));
    }
  }
}

function parseEvent(raw) {
  let event = "message";
  let data = "";
  for (const line of raw.split("\n")) {
    if (line.startsWith("event:")) event = line.slice(6).trim();
    else if (line.startsWith("data:")) data += line.slice(5).trim();
  }
  return { event, data: data ? JSON.parse(data) : null };
}

// ---- the agent ------------------------------------------------------------------

async function runAgent(t, question, signal) {
  t.progress.textContent = "Thinking…";
  let details = null;
  await stream("/agent/stream", { question }, signal, ({ event, data }) => {
    if (event === "status") {
      t.progress.textContent = data.stage === "writing" ? "Writing the answer…" : "Thinking…";
    } else if (event === "tool_call") {
      addStep(t, describeCall(data.tool, data.arguments));
    } else if (event === "tool_result") {
      resolveStep(t, describeResult(data));
    } else if (event === "revising") {
      t.revisions.push(data.problems);
      addStep(t, "Checking the draft: sent back (" + data.problems.map(problemText).join("; ") + ")", "warn");
    } else if (event === "answer") {
      t.text = data.text;
    } else if (event === "details") {
      details = data;
    } else if (event === "error") {
      throw new Error(data.message);
    }
  });
  if (!details) throw new Error("The agent stopped before finishing. Try again in a moment.");

  const evidence = evidenceFrom(details.trace);
  const cited = [];
  t.answer.replaceChildren(renderInline(t.text, (id) => {
    const item = evidence.get(id);
    if (!item) return 0;
    let n = cited.indexOf(item) + 1;
    if (!n) n = cited.push(item);
    return n;
  }));
  t.items = cited;
  renderCards(t);
  t.steps.hidden = true;   // the live timeline is replaced by the panel's steps
  renderPanel(t, details);
  renderFlagLine(t, details);
  finishTurn(t);
}

function problemText(key) { return PROBLEMS[key] || key; }

function parseArgs(json) {
  try { return JSON.parse(json) || {}; } catch { return {}; }
}

function describeCall(tool, argsJson) {
  const a = parseArgs(argsJson);
  if (tool === "search_filings") {
    const where = [a.company, a.fiscal_year ? "FY" + a.fiscal_year : null, a.period, a.latest ? "latest filing" : null]
      .filter(Boolean).join(" ");
    return `Searching filings: "${a.query || ""}"` + (where ? " · " + where : "");
  }
  if (tool === "get_financials") {
    const when = [a.fiscal_year ? "FY" + a.fiscal_year : null, a.period].filter(Boolean).join(" ");
    return `Looking up ${a.company || ""} ${String(a.metric || "").replaceAll("_", " ")}`
      + (when ? " · " + when : "") + (a.breakdown ? ` · by ${a.breakdown}` : "");
  }
  if (tool === "calculate") return `Calculating ${a.expression || ""}`;
  return `Running ${tool}`;
}

function describeResult(r) {
  if (r.error) return { text: "not available", cls: "warn" };
  if (r.ids.length === 1 && r.ids[0].startsWith("calc_")) return { text: "done", cls: "done" };
  return { text: `${r.count} result${r.count === 1 ? "" : "s"}`, cls: "done" };
}

function addStep(t, label, cls) {
  const li = el("li", cls || "pending");
  li.append(el("span", "dot"), el("span", "what", label), el("span", "res"));
  if (!cls) t.pending.push(li);
  t.steps.append(li);
}

function resolveStep(t, { text, cls }) {
  const li = t.pending.shift();
  if (!li) return;
  li.className = cls;
  li.querySelector(".res").textContent = text;
}

// Evidence by id, from the whole trace: passages, fact rows and calculations the model was given.
function evidenceFrom(trace) {
  const evidence = new Map();
  for (const step of trace) {
    let data;
    try { data = JSON.parse(step.result); } catch { continue; }
    if (!data || typeof data !== "object") continue;
    for (const r of Array.isArray(data.results) ? data.results : []) {
      if (!r || typeof r.id !== "string") continue;
      if (typeof r.text === "string") evidence.set(r.id, { type: "passage", ...r });
      else if ("value" in r) evidence.set(r.id, { type: "fact", ...r });
    }
    if (typeof data.id === "string" && "expression" in data) evidence.set(data.id, { type: "calc", ...data });
  }
  return evidence;
}

// **bold** and [id] citations become nodes; everything else is text. Never innerHTML.
// `numberFor(id)` returns the chip number for a cited id, or 0 when the id is not evidence (left as plain text).
function renderInline(text, numberFor) {
  const frag = document.createDocumentFragment();
  const token = /\*\*(.+?)\*\*|\[([^\]\s]+)\]/g;
  let last = 0, m;
  while ((m = token.exec(text)) !== null) {
    if (m.index > last) frag.append(document.createTextNode(text.slice(last, m.index)));
    if (m[1] !== undefined) {
      const strong = el("strong");
      strong.append(renderInline(m[1], numberFor));
      frag.append(strong);
    } else {
      const n = numberFor(m[2]);
      if (n) {
        const b = el("button", "cite", String(n));
        b.type = "button";
        b.dataset.n = n;
        b.setAttribute("aria-label", `Source ${n}`);
        frag.append(b);
      } else {
        frag.append(document.createTextNode(m[0]));
      }
    }
    last = token.lastIndex;
  }
  if (last < text.length) frag.append(document.createTextNode(text.slice(last)));
  return frag;
}

function money(value, unit) {
  if (unit === "USD millions") return `$${Number(value).toLocaleString("en-US")} million`;
  return `${Number(value).toLocaleString("en-US")}${unit ? " " + unit : ""}`;
}

function filingLabel(p) {
  const period = p.fiscal_period && p.fiscal_period !== "FY" ? `${p.fiscal_period} ` : "";
  return `${p.form || "Filing"} ${period}FY${p.fiscal_year}`;
}

// ---- evidence cards ------------------------------------

function itemMeta(item, n) {
  const row = el("div", "meta");
  row.append(el("span", "ref", `[${n}]`));
  if (item.type === "passage") {
    row.append(el("span", "tick", item.ticker), el("span", null, filingLabel(item)), el("span", null, `period ended ${item.period}`));
  } else if (item.type === "fact") {
    row.append(el("span", "tick", item.company), el("span", null, item.derived ? "derived from the filings" : "reported"),
      el("span", null, item.source || ""));
  } else if (item.type === "calc") {
    row.append(el("span", "tick", "Calculation"));
  }
  return row;
}

function factTitle(f) {
  const when = f.period && f.period !== "FY" ? `${f.period} FY${f.fiscal_year}` : `FY${f.fiscal_year}`;
  return `${f.company} ${String(f.metric).replaceAll("_", " ")}, ${when}`;
}

function renderCards(t) {
  t.cards = [];
  t.passages.replaceChildren();
  t.items.forEach((item, i) => {
    const n = i + 1;
    const card = el("article", "passage");
    card.append(itemMeta(item, n));
    if (item.type === "passage") {
      card.append(...passageBody(item.text.trim()));
    } else if (item.type === "fact") {
      card.append(el("p", "value", money(item.value, item.unit)),
        el("p", "detail", `${factTitle(item)} · period ended ${item.period_end}`),
        ...factFlags(item).map((f) => el("p", "detail", f)), el("p", "detail", item.id));
    } else if (item.type === "calc") {
      card.append(el("p", "value", `= ${Number(item.result).toLocaleString("en-US", { maximumFractionDigits: 6 })}`),
        el("p", "detail", item.expression), el("p", "detail", item.id));
    }
    t.cards.push(card);
    t.passages.append(card);
  });
}

// ---- how this was computed (agent) ---------------------------------------------------------

// What a fact row says about itself beyond its value: the caveats a reader needs.
function factFlags(f) {
  const out = [];
  if (f.derived) out.push("derived: a quarter computed from year-to-date figures");
  if ("as_reported" in f) out.push(`as reported, before split adjustment: ${f.as_reported}`);
  if (f.balance) out.push(`balance on ${f.as_of}, not a flow over a period`);
  if (f.part_of) out.push(`part of: ${f.part_of}`);
  return out;
}

const CHECKS = [
  ["uncited", "Every figure has a citation", (n) => `${n} sentence${n === 1 ? "" : "s"} with a figure and no citation`,
    (x) => x],
  ["unknown_ids", "Every cited id was returned by a tool", (n) => `${n} cited id${n === 1 ? "" : "s"} no tool returned`,
    (x) => x],
  ["unsupported", "Each cited figure matches its source", (n) => `${n} figure${n === 1 ? "" : "s"} no cited source states`,
    (x) => `${x[0]}: ${x[1]}`],
  ["slice_mismatch", "No company total is cited as a product or segment figure",
    (n) => `${n} company-wide figure${n === 1 ? "" : "s"} cited for a product, segment or region`, (x) => `${x[0]}: ${x[1]}`],
  ["unacknowledged_missing", "Every requested filing that is missing is acknowledged",
    (n) => `${n} missing filing${n === 1 ? "" : "s"} the answer does not mention`, (x) => x],
];

function checkRow(kind, text, items) {
  const row = el("div", "check " + kind);
  row.append(el("span", "dot"));
  const body = el("div");
  body.append(el("span", null, text));
  if (items && items.length) {
    const ul = el("ul");
    items.forEach((i) => ul.append(el("li", null, i)));
    body.append(ul);
  }
  row.append(body);
  return row;
}

// Problems still in the final answer, in words; empty when the answer passed every check.
function finalProblems(d) {
  const out = [];
  for (const [key, , summary] of CHECKS) if ((d[key] || []).length) out.push(summary(d[key].length));
  if (d.truncated) out.push("the step budget ran out, so the answer was forced");
  if (d.cut_off) out.push("the answer hit the length limit and may be cut off");
  return out;
}

function renderFlagLine(t, d) {
  const problems = finalProblems(d);
  if (!problems.length) return;
  t.flags.replaceChildren(document.createTextNode(`Check this answer: ${problems.join("; ")}.`));
  const open = el("button", "link", "See how this was computed");
  open.type = "button";
  open.addEventListener("click", () => { setPanelOpen(t, true); t.panel.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); });
  t.flags.append(open);
  t.flags.hidden = false;
}

function renderPanel(t, d) {
  const panel = t.panel;
  panel.replaceChildren();

  panel.append(el("h3", null, "Checks"));
  for (const [key, ok, summary, line] of CHECKS) {
    const found = d[key] || [];
    panel.append(found.length ? checkRow("warn", summary(found.length), found.map(line)) : checkRow("ok", ok));
  }
  if (d.revised) {
    const why = t.revisions.flat().map(problemText);
    panel.append(checkRow("info", "Sent back once to fix: " + (why.length ? why.join("; ") : "a failed check") +
      (finalProblems(d).length ? " (not fully fixed)" : " (fixed)")));
  }
  panel.append(d.truncated ? checkRow("warn", `Step budget ran out after ${d.steps} steps; the answer was forced from what it had gathered`)
    : checkRow("ok", `Finished in ${d.steps} step${d.steps === 1 ? "" : "s"}`));
  if (d.cut_off) panel.append(checkRow("warn", "The answer hit the length limit and may be cut off"));

  if (d.resolved_periods && d.resolved_periods.length) {
    panel.append(el("h3", null, "Periods resolved"));
    for (const r of d.resolved_periods) panel.append(checkRow("info", `“${r.phrase}” → ${r.ticker} ${r.label}`));
  }

  panel.append(el("h3", null, "Steps"));
  if (!d.trace.length) panel.append(el("p", "detail", "No tools were called."));
  d.trace.forEach((step) => panel.append(stepDetails(step)));

  panel.append(el("h3", null, "Cost"));
  const input = d.usage.reduce((a, u) => a + u.input, 0), output = d.usage.reduce((a, u) => a + u.output, 0);
  panel.append(el("p", "detail", `${d.usage.length} model call${d.usage.length === 1 ? "" : "s"} · ${input.toLocaleString("en-US")} input tokens · ${output.toLocaleString("en-US")} output tokens`));

  t.panelToggle.hidden = false;
  setPanelOpen(t, false);
}

function stepDetails(step) {
  const det = el("details");
  const sum = el("summary");
  let data = null;
  try { data = JSON.parse(step.result); } catch { /* shown raw below */ }
  const failed = data && data.error;
  const count = data && Array.isArray(data.results) ? data.results.length : null;
  sum.className = failed ? "warn" : "";
  sum.append(document.createTextNode(describeCall(step.tool, step.arguments)),
    el("span", "res", failed ? "not available" : count !== null ? `${count} result${count === 1 ? "" : "s"}` + (step.new_results !== null && step.new_results !== undefined ? `, ${step.new_results} new` : "") : "done"));
  det.append(sum, ...resultBody(data));
  const raw = el("details");
  raw.append(el("summary", null, "Raw result the model saw"), el("pre", null, rawText(step.result)));
  det.append(raw);
  return det;
}

function rawText(result) {
  try { return JSON.stringify(JSON.parse(result), null, 2); } catch { return String(result); }
}

function resultBody(data) {
  if (!data || typeof data !== "object") return [];
  const nodes = [];
  if (data.error) nodes.push(el("p", "detail", "Tool error: " + data.error));
  const rows = Array.isArray(data.results) ? data.results : [];
  if (rows.length && rows.every((r) => r && "value" in r)) {
    const table = el("table");
    const head = el("tr");
    ["Fact", "Value", "Period end", "Source", "Caveats"].forEach((h) => head.append(el("th", null, h)));
    table.append(head);
    for (const r of rows) {
      const tr = el("tr");
      tr.append(el("td", null, r.id), el("td", "num", money(r.value, r.unit)), el("td", "nw", r.period_end || ""),
        el("td", "nw", r.source || ""), el("td", null, factFlags(r).join("; ")));
      table.append(tr);
    }
    const wrap = el("div", "tablewrap");
    wrap.append(table);
    nodes.push(wrap);
  } else if (rows.length) {
    const ul = el("ul", "plist");
    for (const r of rows) {
      const li = el("li");
      li.append(el("strong", null, r.id || "result"),
        document.createTextNode(typeof r.text === "string" ? ` · ${filingLabel(r)}: ${r.text.trim().slice(0, 160)}…` : ""));
      ul.append(li);
    }
    nodes.push(ul);
  }
  if (typeof data.id === "string" && "expression" in data) {
    nodes.push(el("p", "detail", `${data.id}: ${data.expression} = ${data.result}`));
  }
  if (data.note) nodes.push(el("p", "detail", "Tool note: " + data.note));
  return nodes;
}

// A quote, with a "Show full passage" button when it is longer than the excerpt.
function passageBody(fullText) {
  const short = fullText.length > 500 ? fullText.slice(0, 500) + "…" : fullText;
  const quote = el("p", "quote");
  const hl = el("span", "hl", short);
  quote.append(hl);
  const nodes = [quote];
  if (short !== fullText) {
    const more = el("button", "more", "Show full passage");
    more.type = "button";
    let expanded = false;
    more.onclick = () => {
      expanded = !expanded;
      hl.textContent = expanded ? fullText : short;
      more.textContent = expanded ? "Show less" : "Show full passage";
    };
    nodes.push(more);
  }
  return nodes;
}

function clearHighlight(t) {
  if (t) {
    clearTimeout(t.sweepTimer);
    t.passages.querySelectorAll(".passage.lit, .passage.swept").forEach((p) => p.classList.remove("lit", "swept"));
  } else {
    turns.forEach(clearHighlight);
  }
}

function highlight(t, n) {
  const card = t.cards[n - 1];
  if (!card) return;

  // Clicking the citation that's already active turns it off
  if (card.classList.contains("lit")) {
    clearHighlight(t);
    return;
  }

  clearHighlight();
  if (t.sources.hidden) setSourcesOpen(t, true);
  card.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });

  void card.offsetWidth; // let the sweep restart cleanly
  card.classList.add("lit", "swept");

  // Fade the text highlight so the passage is readable; the border stays
  t.sweepTimer = setTimeout(() => card.classList.remove("swept"), 2200);
}

function showPreview(t, btn) {
  const n = Number(btn.dataset.n);
  const item = t.items[n - 1];
  if (!item) return;

  const body = el("p", "quote");
  if (item.type === "passage") body.textContent = item.text.trim().slice(0, 240) + "…";
  else if (item.type === "fact") body.textContent = `${factTitle(item)}: ${money(item.value, item.unit)}`;
  else if (item.type === "calc") body.textContent = `${item.expression} = ${item.result}`;
  preview.replaceChildren(itemMeta(item, n), body);

  const r = btn.getBoundingClientRect();
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 356;
  preview.style.left = Math.max(8, Math.min(window.scrollX + r.left, maxLeft)) + "px";
  preview.style.top = window.scrollY + r.bottom + 8 + "px";
  preview.classList.add("show");
}

function hidePreview() { preview.classList.remove("show"); }

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") clearHighlight();
});

updateThreadChrome();
</script>
</body>
</html>
